name: Desktop App Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão desktop opcional. Ex: 1.0.155"
        required: false
        type: string
  push:
    branches:
      - main
      - master
    paths:
      - "electron/**"
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/electron-build.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    concurrency:
      group: desktop-release-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Set desktop release version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manualVersion = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($manualVersion)) {
            $baseVersion = node -p "require('./package.json').version"
            $parts = $baseVersion.Split('.')
            $basePatch = [int]$parts[2]
            $runPatch = [int]"${{ github.run_number }}"
            $latestPatch = 0
            try {
              $releaseTags = gh release list --limit 100 --json tagName --jq '.[].tagName'
              foreach ($releaseTag in $releaseTags) {
                if ($releaseTag -match "^v?$($parts[0])\.$($parts[1])\.(\d+)$") {
                  $latestPatch = [Math]::Max($latestPatch, [int]$Matches[1])
                }
              }
            } catch {
              Write-Host "Nao foi possivel consultar a ultima release publicada. Usando package.json como base."
            }
            $patch = [Math]::Max([Math]::Max($basePatch + 1, $latestPatch + 1), $runPatch)
            $version = "$($parts[0]).$($parts[1]).$patch"
          } else {
            $version = $manualVersion.Trim()
          }
          node scripts/set-release-version.cjs $version

      - name: Build web app for desktop
        run: npm run build:desktop

      - name: Sync web dist into Electron package
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force electron/dist -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force dist electron/dist

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      - name: Publish Windows installer
        working-directory: electron
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build-win:publish

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: popsystem-desktop-windows
          path: |
            electron/dist-electron/*.exe
            electron/dist-electron/*.blockmap
            electron/dist-electron/latest.yml
