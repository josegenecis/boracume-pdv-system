name: electron-build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Install Electron deps
        working-directory: electron
        run: |
          npm ci
      - name: Rebuild native deps
        working-directory: electron
        run: |
          npm run rebuild
      - name: Build Windows app
        working-directory: electron
        run: |
          npm run build-win
      - name: Create/Update Release (Windows)
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: BoraCume Desktop ${{ github.ref_name }}
          allowUpdates: true
          artifacts: "electron/dist-electron/*.exe,electron/dist-electron/*.blockmap,electron/dist-electron/latest.yml"
          makeLatest: true
          artifactErrorsFailBuild: true
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows
          path: electron/dist-electron/**

  build-macos:
    permissions:
      contents: write
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Install Electron deps
        working-directory: electron
        run: |
          npm ci
      - name: Rebuild native deps
        working-directory: electron
        run: |
          npm run rebuild
      - name: Build macOS app
        working-directory: electron
        run: |
          npm run build-mac
      - name: Create/Update Release (macOS)
        uses: ncipollo/release-action@v1
        with:
          tag: latest
          name: Latest Desktop Builds
          allowUpdates: true
          artifacts: "electron/dist-electron/**"
          artifactErrorsFailBuild: true
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-macos
          path: electron/dist-electron/**
